<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f5f8ee">
<meta name="description" content="A cheerful 3D-style portrait Snake arcade game. Play, collect berries and beat your best score.">
<title>Snakey — A Little Arcade Game</title>
<style>
:root{--ink:#244331;--muted:#809486;--green:#62bd78;--deep:#328653;--cream:#f5f8ee;--card:#fffefa;--line:#e4ebdc;--shadow:0 16px 40px #385d3517}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
body{display:flex;justify-content:center;min-height:100svh;padding:14px}
.app{width:min(100%,460px);min-height:calc(100svh - 28px);display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 3px}
.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#b9e9a9,#62bd78);display:grid;place-items:center;font-size:25px;box-shadow:inset 0 3px 5px #ffffffa8,0 5px 12px #448d4b25}
.brand h1{font-size:23px;line-height:1;margin:0;letter-spacing:-1px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:2px;margin-top:4px;font-weight:800}
.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:18px;box-shadow:0 4px 10px #385d350a;cursor:pointer}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:10px 12px;box-shadow:0 5px 15px #385d3508}
.stat label{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:900}.stat strong{display:block;font-size:22px;margin-top:2px;letter-spacing:-.5px}
.stage{position:relative;flex:1;min-height:330px;max-height: min(58svh,590px);background:linear-gradient(145deg,#e6f3df,#d5e9d1);border:1px solid #d4e5cf;border-radius:25px;padding:10px;box-shadow:inset 0 3px 8px #fff9,var(--shadow);overflow:hidden}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 10%,#ffffff80,transparent 45%),radial-gradient(ellipse at 90% 90%,#a7d6a455,transparent 50%);pointer-events:none}
canvas{width:100%;height:100%;display:block;position:relative;touch-action:none}
.overlay{position:absolute;inset:10px;border-radius:19px;background:#f8fbf0d9;backdrop-filter:blur(7px);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;z-index:2}
.dialog{width:min(100%,290px);padding:23px 20px 20px;background:#fffefa;border:1px solid #e5eddf;border-radius:24px;box-shadow:0 18px 40px #355e3525}
.hero{font-size:62px;line-height:1.2;filter:drop-shadow(0 7px 3px #315d3020)}
.dialog h2{font-size:25px;letter-spacing:-.8px;margin:8px 0 6px}.dialog p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 18px}
.primary{width:100%;border:0;border-radius:15px;padding:14px 18px;background:linear-gradient(180deg,#78d18b,#43a968);color:white;font-size:15px;font-weight:900;box-shadow:0 6px 0 #328653,0 10px 17px #32865335;cursor:pointer;text-shadow:0 1px #32865366}
.primary:active{transform:translateY(3px);box-shadow:0 3px 0 #328653}
.controls{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:12px 14px;box-shadow:0 7px 18px #385d3508}
.controlhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.controlhead b{font-size:12px}.controlhead span{font-size:10px;color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,48px);gap:6px;justify-content:center}
.pad button{border:1px solid #dcebd8;background:linear-gradient(180deg,#f5fbf1,#eaf5e5);color:#398653;border-radius:13px;font-size:23px;font-weight:900;box-shadow:0 3px 0 #d4e5d0;cursor:pointer;touch-action:manipulation}
.pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #d4e5d0}
.actions{display:flex;gap:8px}.secondary{flex:1;border:1px solid var(--line);background:#fffefa;color:#39704b;border-radius:13px;padding:11px;font-weight:800;cursor:pointer}
.footer{text-align:center;color:#91a195;font-size:10px;padding:0 0 3px}
@media(min-height:800px){.stage{max-height: min(60svh,620px)}}
@media(max-height:690px){body{padding:8px}.app{min-height:calc(100svh - 16px);gap:8px}.stage{min-height:260px;max-height:48svh}.stat{padding:7px 10px}.controls{padding:8px 12px}.pad{grid-template-rows:repeat(2,42px)}}
</style>
</head>
<body>
<main class="app">
 <header class="top">
  <div class="brand"><div class="logo">🐍</div><div><h1>Snakey</h1><small>A LITTLE ARCADE GAME</small></div></div>
  <button class="iconbtn" id="soundBtn" aria-label="Toggle sound">🔊</button>
 </header>
 <section class="stats" aria-label="Game stats">
  <div class="stat"><label>SCORE</label><strong id="score">000</strong></div>
  <div class="stat"><label>BEST</label><strong id="best">000</strong></div>
  <div class="stat"><label>LEVEL</label><strong id="level">01</strong></div>
 </section>
 <section class="stage">
  <canvas id="game" width="400" height="600" aria-label="Snake game board"></canvas>
  <div class="overlay" id="overlay">
   <div class="dialog">
    <div class="hero" id="hero">🐍</div>
    <h2 id="dialogTitle">Ready to wiggle?</h2>
    <p id="dialogText">Collect the juicy berries, grow your snake and try not to bump into yourself!</p>
    <button class="primary" id="mainBtn">LET'S PLAY</button>
   </div>
  </div>
 </section>
 <section class="controls">
  <div class="controlhead"><b>CONTROLS</b><span>Arrow keys · WASD · Swipe</span></div>
  <div class="pad">
   <span></span><button data-dir="up" aria-label="Up">↑</button><span></span>
   <button data-dir="left" aria-label="Left">←</button><button data-dir="down" aria-label="Down">↓</button><button data-dir="right" aria-label="Right">→</button>
  </div>
 </section>
 <div class="actions"><button class="secondary" id="pauseBtn">Ⅱ Pause</button><button class="secondary" id="restartBtn">↻ Restart</button></div>
 <footer class="footer">A tiny game made for big smiles ✦</footer>
</main>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const COLS=16,ROWS=24,CELL=25;
let snake,berry,dir,nextDir,score,level,best=0,obstacles=[],state='ready',timer=null,sound=true,audioCtx=null,stepMs=155;
try{best=Number(localStorage.getItem('snakey-best')||0)}catch(e){}
$('best').textContent=fmt(best);
function fmt(n){return String(n).padStart(3,'0')}
function tone(freq=550,duration=.08){if(!sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.045,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function reset(){snake=[{x:5,y:12},{x:4,y:12},{x:3,y:12}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;level=1;obstacles=[];stepMs=155;$('score').textContent=fmt(0);$('level').textContent='01';placeBerry();draw()}
function placeBerry(){do{berry={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(p=>p.x===berry.x&&p.y===berry.y)||obstacles.some(p=>p.x===berry.x&&p.y===berry.y))}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function draw(){
 const w=400,h=600;ctx.clearRect(0,0,w,h);
 // soft checkerboard playfield
 for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){ctx.fillStyle=(x+y)%2?'#e0efda':'#e7f2e2';rounded(x*CELL+1,y*CELL+1,CELL-2,CELL-2,5)}
 // subtle border
 ctx.strokeStyle='#c8dfc4';ctx.lineWidth=3;ctx.strokeRect(2,2,396,596);
 // obstacles, unlocked after level 3
 obstacles.forEach(p=>{ctx.fillStyle='#a5b99e';ctx.shadowColor='#8ba487';ctx.shadowBlur=5;rounded(p.x*CELL+4,p.y*CELL+5,17,17,6);ctx.shadowBlur=0;ctx.fillStyle='#d9e7d3';rounded(p.x*CELL+7,p.y*CELL+7,7,4,2)});
 // berry with stem and shine
 let bx=berry.x*CELL+12.5,by=berry.y*CELL+13;
 ctx.fillStyle='#438d50';ctx.fillRect(bx-1,by-13,3,6);ctx.fillStyle='#f46c65';ctx.shadowColor='#ed6b60';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(bx,by,8,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffd3b9';ctx.beginPath();ctx.arc(bx-3,by-3,2.3,0,Math.PI*2);ctx.fill();
 // snake segments with dimensional highlights
 snake.forEach((p,i)=>{let x=p.x*CELL,y=p.y*CELL;ctx.fillStyle=i===0?'#29975b':(i%2?'#65c981':'#51b970');ctx.shadowColor='#4a9e65';ctx.shadowBlur=i===0?9:4;rounded(x+2,y+3,21,21,8);ctx.shadowBlur=0;ctx.fillStyle='#ffffff55';rounded(x+5,y+5,12,4,3)});
 // eyes face movement direction
 const head=snake[0];let ex=head.x*CELL+12.5,ey=head.y*CELL+12.5;ctx.fillStyle='#174d32';
 if(dir.x!==0){ctx.beginPath();ctx.arc(ex+dir.x*4,ey-4,2,0,7);ctx.arc(ex+dir.x*4,ey+4,2,0,7);ctx.fill()}else{ctx.beginPath();ctx.arc(ex-4,ey+dir.y*4,2,0,7);ctx.arc(ex+4,ey+dir.y*4,2,0,7);ctx.fill()}
}
function setDirection(d){if(d==='up'&&dir.y!==1)nextDir={x:0,y:-1};if(d==='down'&&dir.y!==-1)nextDir={x:0,y:1};if(d==='left'&&dir.x!==1)nextDir={x:-1,y:0};if(d==='right'&&dir.x!==-1)nextDir={x:1,y:0}}
function tick(){
 if(state!=='playing')return;dir=nextDir;
 const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 const ate=head.x===berry.x&&head.y===berry.y;
 if(head.x<0||head.y<0||head.x>=COLS||head.y>=ROWS||obstacles.some(p=>p.x===head.x&&p.y===head.y)||snake.slice(0,ate?undefined:-1).some(p=>p.x===head.x&&p.y===head.y)){gameOver();return}
 snake.unshift(head);
 if(ate){score+=10;$('score').textContent=fmt(score);tone(760,.09);const newLevel=Math.floor(score/50)+1;if(newLevel!==level){level=newLevel;$('level').textContent=fmt(level);tone(920,.16);if(level>=3)addObstacles()}if(score>best){best=score;$('best').textContent=fmt(best);try{localStorage.setItem('snakey-best',String(best))}catch(e){}}placeBerry();stepMs=Math.max(75,155-(level-1)*9);clearInterval(timer);timer=setInterval(tick,stepMs)}else snake.pop();
 draw();
}
function addObstacles(){obstacles=[];let count=Math.min(2+(level-3)*2,12);for(let i=0;i<count;i++){let p;do{p={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}while(snake.some(s=>s.x===p.x&&s.y===p.y)||(berry.x===p.x&&berry.y===p.y)||obstacles.some(o=>o.x===p.x&&o.y===p.y)||(p.x>4&&p.x<11&&p.y>8&&p.y<16));obstacles.push(p)}}
function showOverlay(icon,title,desc,button,action){$('hero').textContent=icon;$('dialogTitle').textContent=title;$('dialogText').textContent=desc;$('mainBtn').textContent=button;$('mainBtn').onclick=action;$('overlay').style.display='flex'}
function start(){reset();state='playing';$('overlay').style.display='none';clearInterval(timer);timer=setInterval(tick,stepMs);tone(520,.07)}
function gameOver(){state='over';clearInterval(timer);tone(170,.25);showOverlay('🎉','Nice try!','You scored '+score+' points. Your best is '+best+'. Ready for another round?','PLAY AGAIN',start)}
function pause(){if(state==='playing'){state='paused';clearInterval(timer);showOverlay('⏸️','Taking a break?','Your snake is waiting right here.','RESUME',resume)}else if(state==='paused')resume()}
function resume(){state='playing';$('overlay').style.display='none';clearInterval(timer);timer=setInterval(tick,stepMs)}
$('mainBtn').onclick=start;$('pauseBtn').onclick=pause;$('restartBtn').onclick=start;
$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊':'🔇';if(sound)tone(550)};
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();setDirection(b.dataset.dir)}));
document.addEventListener('keydown',e=>{const map={ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down',ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right'};if(map[e.key]){e.preventDefault();setDirection(map[e.key])}if(e.code==='Space'){e.preventDefault();pause()}});
let touchStart=null;canvas.addEventListener('touchstart',e=>{const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:true});canvas.addEventListener('touchend',e=>{if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;if(Math.max(Math.abs(dx),Math.abs(dy))>18)setDirection(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'));touchStart=null},{passive:true});
reset();
})();
</script>
</body>
</html>
